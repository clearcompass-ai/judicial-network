name: publish-image

# Build the JN service containers and publish them to the GitHub Container
# Registry as signed, multi-arch images with an SBOM and SLSA provenance.
#
# The JN ships two deployables, so the fleet-standard publish workflow is
# generalized to a matrix — one entry per service. Images:
#
#   ghcr.io/clearcompass-ai/judicial-network             (network-api enforcer)
#   ghcr.io/clearcompass-ai/judicial-network/aggregator  (read-projection)
#
# network-api keeps the BARE repo name because docker-compose.jn.yml's `image:`
# ref depends on it. Deps are public (baseproof SDK + attesta-tools/libs), so no
# build-time VCS auth is needed.

on:
  push:
    # `claude/**` branches build a branch-tagged image (type=ref,event=branch →
    # e.g. :claude-brave-lovelace-YIc2o) so the e2e harness can validate the
    # open-HTTPS JN/aggregator legs against a real image BEFORE the change is
    # tagged/merged. Only `main` gets :latest (is_default_branch, line below).
    branches: [main, "claude/**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read # checkout
  packages: write # push to ghcr
  id-token: write # cosign keyless signing + provenance (OIDC)
  attestations: write # GitHub build-provenance attestations

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # network-api is the repo's PRIMARY image — bare repo name (the
          # docker-compose.jn.yml `image:` ref depends on this exact name).
          - service: network-api
            dockerfile: deployment/local/Dockerfile.network-api
            suffix: ""
          - service: aggregator
            dockerfile: deployment/local/Dockerfile.aggregator
            suffix: /aggregator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # Per-service GHA cache scope so the two builds don't evict each other.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max # SLSA provenance attestation
          sbom: true # SBOM attestation

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless / Sigstore OIDC)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Sign by digest so the signature covers the multi-arch index and every
        # tag that points at it. Keyless: identity = this workflow's OIDC token,
        # transparency-logged in Rekor — no long-lived signing key to hold.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
