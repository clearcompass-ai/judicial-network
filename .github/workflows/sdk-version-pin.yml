name: sdk-version-pin

# D10 — pin the attesta SDK + attesta-tools libs versions JN consumes so a
# stray bump (manual or automated) fails the PR rather than landing
# silently. The pins are the contract the migration plan in issue #61
# enforces: every JN package is verified against this exact pair.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REQUIRED_ATTESTA_VERSION: v1.33.1
  REQUIRED_LIBS_VERSION: v1.29.0

jobs:
  sdk-version-pin:
    name: SDK + libs version pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert attesta + attesta-tools/libs pins
        run: |
          set -euo pipefail

          actual_attesta=$(grep -E '^\s+github.com/clearcompass-ai/attesta v' go.mod | head -1 | awk '{print $2}')
          if [[ "$actual_attesta" != "${REQUIRED_ATTESTA_VERSION}" ]]; then
            echo "::error file=go.mod::attesta pinned to ${actual_attesta}, want ${REQUIRED_ATTESTA_VERSION}"
            echo "::error::SDK version drift: see https://github.com/clearcompass-ai/judicial-network/issues/61"
            exit 1
          fi
          echo "✓ attesta @ ${actual_attesta}"

          actual_libs=$(grep -E '^\s+github.com/clearcompass-ai/attesta-tools/libs v' go.mod | head -1 | awk '{print $2}')
          if [[ "$actual_libs" != "${REQUIRED_LIBS_VERSION}" ]]; then
            echo "::error file=go.mod::attesta-tools/libs pinned to ${actual_libs}, want ${REQUIRED_LIBS_VERSION}"
            echo "::error::libs version drift: see https://github.com/clearcompass-ai/judicial-network/issues/61"
            exit 1
          fi
          echo "✓ attesta-tools/libs @ ${actual_libs}"
