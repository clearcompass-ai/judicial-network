{{/*
Chart-managed database Secret. Emitted only when:
  - database.existingSecret is empty (no operator-supplied Secret to
    reference), AND
  - database.url is set (we have something to write).

When database.existingSecret is set the deployment references that Secret
directly and this template renders nothing.
*/}}
{{- include "aggregator.validateDatabase" . -}}
{{- if and (not .Values.database.existingSecret) .Values.database.url -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aggregator.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggregator.labels" . | nindent 4 }}
type: Opaque
stringData:
  TOOLS_DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
