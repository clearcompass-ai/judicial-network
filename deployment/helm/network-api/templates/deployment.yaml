{{- include "network-api.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "network-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "network-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "network-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when non-secret env changes.
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "network-api.serviceAccountName" . }}
      # The enforcer never calls the Kubernetes API — don't mount its token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: network-api
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.container.port }}
          envFrom:
            - configMapRef:
                name: {{ include "network-api.fullname" . }}
          {{- with .Values.container.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # mTLS-only listener (RequireAndVerifyClientCert): a kubelet httpGet
          # probe cannot present a client cert, so probe with tcpSocket.
          livenessProbe:
            {{- toYaml .Values.container.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.container.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.container.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so give the process a writable /tmp.
            - name: tmp
              mountPath: /tmp
            # Standard cert/key/bootstrap mount paths — the binary auto-detects
            # these, so NO *_FILE env is set (the orchestrator-agnostic convention).
            - name: server-tls
              mountPath: /etc/network-api/tls
              readOnly: true
            - name: bootstrap
              mountPath: /etc/network-api/bootstrap.json
              subPath: bootstrap.json
              readOnly: true
            {{- if .Values.admissionKey.existingSecret }}
            - name: admission-key
              mountPath: /etc/network-api/keys
              readOnly: true
            {{- end }}
            {{- if .Values.ledgerClientTLS.existingSecret }}
            - name: ledger-tls
              mountPath: /etc/network-api/ledger-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: server-tls
          secret:
            secretName: {{ .Values.serverTLS.existingSecret }}
        - name: bootstrap
          secret:
            secretName: {{ .Values.bootstrap.existingSecret }}
            items:
              - key: {{ .Values.bootstrap.key }}
                path: bootstrap.json
        {{- if .Values.admissionKey.existingSecret }}
        - name: admission-key
          secret:
            secretName: {{ .Values.admissionKey.existingSecret }}
            items:
              - key: {{ .Values.admissionKey.key }}
                path: admission-authority.pem
        {{- end }}
        {{- if .Values.ledgerClientTLS.existingSecret }}
        - name: ledger-tls
          secret:
            secretName: {{ .Values.ledgerClientTLS.existingSecret }}
        {{- end }}
